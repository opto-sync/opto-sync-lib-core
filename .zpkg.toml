[package]
org = "opto-sync"
name = "opto-sync-lib-core"
version = "0.1.0"
description = "SeaORM boundaries for Opto Sync product and admin data"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/opto-sync/opto-sync-lib-core"

[install]
dir = ".vendor/.zed"

[targets.rust]
dir = "."
adapter = "rust"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [
  "Cargo.lock",
  "admin-orm/Cargo.lock",
  "**/target/**",
]
