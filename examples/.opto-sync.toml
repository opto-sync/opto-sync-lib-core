version = 1
mode = "hybrid"
strict = true

[flags2env]
contract = ".cli-flags.toml"
require_audit = true
precedence = "argv-over-env"

[sync]
push_interval_ms = 3000
pull_interval_ms = 3000
max_batch_size = 256
conflict_policy = "last-write-wins"

[[env]]
name = "api_base_url"
key = "OPTO_SYNC_API_HTTP_BASE"
kind = "url"
required = false
secret = false
default = "http://127.0.0.1:8080/"

[[env]]
name = "auth_token"
key = "SHARED_AUTH_CUSTOMER_TOKEN"
kind = "string"
required = false
secret = true

[[env]]
name = "bind_addr"
key = "OPTO_SYNC_API_BIND"
kind = "string"
required = false
secret = false
default = "127.0.0.1:8080"

[[env]]
name = "database_url"
key = "DATABASE_URL"
kind = "url"
required = false
secret = true

[client]
enabled = true
api_base_url_binding = "api_base_url"
auth_token_binding = "auth_token"

[server]
enabled = true
bind_addr_binding = "bind_addr"
database_url_binding = "database_url"
