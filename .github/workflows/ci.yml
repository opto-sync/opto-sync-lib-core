name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
            admin-orm -> target

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path admin-orm/Cargo.toml --all -- --check

      - name: Lint
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path admin-orm/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: |
          cargo test --all-targets --all-features
          cargo test --manifest-path admin-orm/Cargo.toml --all-targets --all-features
