name: opto-sync-config-runtime

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "src/opto_sync_config.rs"
      - "src/lib.rs"
      - ".github/workflows/opto-sync-config-runtime.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/opto_sync_config.rs"
      - "src/lib.rs"
      - ".github/workflows/opto-sync-config-runtime.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test strict .opto-sync.toml runtime projection
        run: cargo test --all-targets
