[package]
name = "opto-sync-lib-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SeaORM boundary for Opto Sync on PostgreSQL and CockroachDB"
repository = "https://github.com/opto-sync/opto-sync-lib-core"

[features]
default = ["read-only"]
read-only = []
read-write = ["read-only"]
migrate = ["read-write"]

[dependencies]
ores-config-discovery = { git = "https://github.com/ORESoftware/ores-config-discovery", rev = "1204b0ae3fd5d1ff6075bd7c5fe227aa6f9f96f5", default-features = false }
next-loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log.git", rev = "a5ec8812df692ccc3bdcaaf89d984c44714970d5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
url = "2"

[lints.rust]
unsafe_code = "forbid"
