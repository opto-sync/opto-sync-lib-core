[package]
name = "opto-sync-lib-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SeaORM boundary for Opto Sync on PostgreSQL and CockroachDB"
repository = "https://github.com/opto-sync/opto-sync-lib-core"

[features]
default = ["read-only"]
read-only = []
read-write = ["read-only"]
migrate = ["read-write"]

[dependencies]
ores-config-discovery = { git = "https://github.com/ORESoftware/ores-config-discovery", rev = "3a6d0ae764931f37724fe6ff6d07302c507378c8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
url = "2"

[lints.rust]
unsafe_code = "forbid"
